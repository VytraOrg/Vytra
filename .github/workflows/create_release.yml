name: Build & Publish Daily Release APK

on:
  schedule:
    # Runs once daily after 04:00 AM IST (04:15 AM IST / 22:45 UTC)
    - cron: '45 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits in frontend since last release tag
        id: check
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing release tags found. Proceeding with build."
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            COMMITS_SINCE=$(git rev-list "${LATEST_TAG}..HEAD" --count -- frontend/)
            echo "Frontend commits since ${LATEST_TAG}: ${COMMITS_SINCE}"
            if [ "$COMMITS_SINCE" -gt 0 ]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
            else
              echo "No new frontend commits since ${LATEST_TAG}. Skipping daily build."
              echo "should_release=false" >> $GITHUB_OUTPUT
            fi
          fi

  build-and-release:
    needs: check-changes
    if: github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Generate placeholder secrets for CI
        run: |
          mkdir -p frontend/lib/core/config
          echo "class Secrets { static const String googleMapsApiKey = ''; }" > frontend/lib/core/config/secrets.dart

      - name: Compute App Version & Build Number
        id: release_info
        run: |
          VERSION=$(grep '^version:' frontend/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUM=$(( 13 + ${{ github.run_number }} ))
          TAG="v${VERSION}-b${BUILD_NUM}"
          NAME="Vytra v${VERSION} (Build ${BUILD_NUM})"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Configure Android NDK for native assets
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk" ] && [ "$(ls -A $ANDROID_SDK_ROOT/ndk 2>/dev/null)" ]; then
            NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* | sort -V | tail -n 1)
            echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "Using preinstalled NDK: $NDK_PATH"
          else
            echo "Installing Android NDK..."
            echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          fi

      - name: Build Flutter APK
        run: |
          cd frontend
          flutter build apk --release --android-skip-build-dependency-validation --build-name=${{ steps.release_info.outputs.version }} --build-number=${{ steps.release_info.outputs.build_num }}

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk dist/Vytra.apk

      - name: Create GitHub Release and Attach Vytra.apk
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/Vytra.apk
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
