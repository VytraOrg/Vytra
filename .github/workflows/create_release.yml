name: Build & Publish Daily Release APK

on:
  schedule:
    # Runs once daily after 04:00 AM IST (04:15 AM IST / 22:45 UTC)
    - cron: '45 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Generate placeholder secrets for CI
        run: |
          mkdir -p frontend/lib/core/config
          echo "class Secrets { static const String googleMapsApiKey = ''; }" > frontend/lib/core/config/secrets.dart

      - name: Compute App Version & Build Number
        id: release_info
        run: |
          VERSION=$(grep '^version:' frontend/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUM=$(( 13 + ${{ github.run_number }} ))
          TAG="v${VERSION}-b${BUILD_NUM}"
          NAME="Vytra v${VERSION} (Build ${BUILD_NUM})"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_num=${BUILD_NUM}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Build Flutter APK
        run: |
          cd frontend
          flutter build apk --release --build-name=${{ steps.release_info.outputs.version }} --build-number=${{ steps.release_info.outputs.build_num }}

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk dist/Vytra.apk

      - name: Create GitHub Release and Attach Vytra.apk
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vytra.apk
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
