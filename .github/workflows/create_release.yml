name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Generate placeholder secrets for CI
        run: |
          mkdir -p frontend/lib/core/config
          echo "class Secrets { static const String googleMapsApiKey = ''; }" > frontend/lib/core/config/secrets.dart

      - name: Build Flutter APK
        run: |
          cd frontend
          flutter build apk --release

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp frontend/build/app/outputs/flutter-apk/app-release.apk dist/Vytra.apk

      - name: Create GitHub Release and Attach Vytra.apk
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Vytra.apk
          name: Vytra ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
